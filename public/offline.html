<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#b91c1c">
    <title>Offline · Nihongo Path</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf7f2;
        --surface: #ffffff;
        --text: #26211d;
        --muted: #746a61;
        --border: #e7ded4;
        --primary: #b91c1c;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151312;
          --surface: #1f1c1a;
          --text: #f5efe7;
          --muted: #b8ada2;
          --border: #3a332e;
          --primary: #f87171;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 520px);
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        padding: 28px;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .brand {
        margin-bottom: 14px;
        color: var(--primary);
        font-size: clamp(2.25rem, 12vw, 4rem);
        font-weight: 700;
        line-height: 1;
      }

      .title {
        margin-bottom: 10px;
        color: var(--text);
        font-size: 1.125rem;
        font-weight: 700;
      }

      a {
        display: inline-flex;
        margin-top: 22px;
        color: var(--primary);
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">日本語の道</div>
      <p class="title">This lesson is not available offline yet.</p>
      <p>Open this page once while connected to cache it for offline reading. Furigana generation also needs the server for now.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
